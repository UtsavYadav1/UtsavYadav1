name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UtsavYadav1
          template: classic
          
          # 1. This disables the Header, Repos, and Metadata (the top part you don't want)
          base: ""
          
          # 2. This enables the Spider Chart
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          # 3. This enables the "Contributed to" list
          plugin_notable: yes
          plugin_notable_from: organization
          
          config_timezone: Asia/Kolkata
