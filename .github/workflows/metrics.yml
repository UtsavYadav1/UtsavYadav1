name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UtsavYadav1
          template: classic
          
          # Force disable base content (Header, Activity, Community, Repos, Metadata)
          base: ""
          
          # Enable ONLY the Spider Chart
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          # Enable ONLY the Contributed list
          plugin_notable: yes
          plugin_notable_from: organization
          
          config_timezone: Asia/Kolkata
