name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UtsavYadav1
          template: classic
          
          # This is the key change: Disable the base info (header, repos)
          # so we ONLY get the graphs you want.
          base: ""
          
          # Spider Chart (The green graph)
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          # Contributed To List (The left side list)
          plugin_notable: yes
          plugin_notable_from: organization
          
          # Isometric Calendar (The 3D block graph from your other screenshot)
          # If you don't want this 3D calendar, remove the next 2 lines.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
